<style>

    --brand: #ff2a14;
    --ground: #000;
    --text: #fff;
    --text-secondary: rgba(255, 255, 255, 0.72);
  }
  @supports (color: color(display-p3 1 0 0)) {
    :root { --brand: color(display-p3 1 0.056 0); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text); }
  body {
    font-family: "Atkinson Hyperlegible Next", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  #map { position: fixed; inset: 0; }
  .maplibregl-ctrl-attrib { background: rgba(0, 0, 0, 0.5) !important; color: rgba(255, 255, 255, 0.5); font-size: 10px; }
  .maplibregl-ctrl-attrib a { color: rgba(255, 255, 255, 0.6); }
  .maplibregl-ctrl-attrib-button { filter: invert(1); }
  .shade {
    position: fixed; inset: 0; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(0, 0, 0, 0.92) 0%, rgba(0, 0, 0, 0.7) 32%, rgba(0, 0, 0, 0) 62%),
      radial-gradient(ellipse at 70% 50%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.65) 100%);
  }
  main {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 clamp(16px, 7vw, 120px);
  }
  .icon {
    width: clamp(96px, 11vw, 148px); height: auto; aspect-ratio: 1;
    filter: drop-shadow(0 18px 40px rgba(255, 42, 20, 0.28));
  }
  h1 {
    margin: 0.35em 0 0; font-weight: 800; letter-spacing: -0.02em; line-height: 1;
    font-size: clamp(56px, 9vw, 128px);
  }
  p {
    margin: 0.5em 0 0; max-width: 18em; font-weight: 400; line-height: 1.25;
    font-size: clamp(20px, 2.4vw, 32px); color: var(--text-secondary);
  }
  .plan {
    --unit: clamp(2.6px, 0.36vw, 4.2px);
    margin-top: clamp(28px, 4vh, 48px);
    display: flex; align-items: flex-end; gap: clamp(6px, 0.8vw, 12px);
    height: calc(var(--unit) * 40);
  }
  .week { display: flex; flex-direction: column-reverse; gap: 3px; width: clamp(16px, 2.1vw, 28px); }
  .run {
    border-radius: 999px; height: calc(var(--unit) * var(--km) - 3px);
    background: rgba(255, 255, 255, 0.9);
    transform-origin: bottom; animation: rise 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
    animation-delay: calc(var(--i) * 70ms + var(--j) * 40ms + 300ms);
  }
  .run.long { background: var(--brand); }
  .week.rest .run { opacity: 0.55; }
  .week.next .run { background: none; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.9); }
  .week.next .run.long { box-shadow: inset 0 0 0 2px var(--brand); }
  @keyframes rise { from { transform: scaleY(0); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .run { animation: none; } }
  @media (max-width: 720px), (orientation: portrait) {
    .shade {
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.94) 0%, rgba(0, 0, 0, 0.7) 34%, rgba(0, 0, 0, 0) 62%),
        radial-gradient(ellipse at 50% 72%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.6) 100%);
    }
    main { justify-content: flex-start; padding-top: clamp(40px, 9vh, 96px); }
  }
</style>

    map.addLayer({ id: "run-glow", type: "line", source: "glow", layout: round,
      paint: { "line-color": brand, "line-width": 10, "line-blur": 6, "line-opacity": 0 } });
    map.addLayer({ id: "run-line", type: "line", source: "run", layout: round,
      paint: { "line-color": brand, "line-width": 3.5 } });
    map.addSource("ends", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({ id: "ends", type: "circle", source: "ends",
      paint: { "circle-radius": 5, "circle-color": "#fff", "circle-stroke-color": brand, "circle-stroke-width": 3 } });
    const lengths = route.reduce((acc, c, i) => {
      if (i === 0) return [0];
      const [x0, y0] = route[i - 1];
      const dx = (c[0] - x0) * Math.cos(c[1] * Math.PI / 180), dy = c[1] - y0;
      return [...acc, acc[i - 1] + Math.hypot(dx, dy)];
    }, []);
    const total = lengths[lengths.length - 1];
    const reveal = (progress) => {
      const target = progress * total;
      const i = Math.max(1, lengths.findIndex((l) => l >= target));
      const [a, b] = [route[i - 1], route[i]];
      const t = (target - lengths[i - 1]) / ((lengths[i] - lengths[i - 1]) || 1);
      const tip = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
      map.getSource("run").setData(line(progress >= 1 ? route : [...route.slice(0, i), tip]));
      for (const [id, opacity] of [["run-haze", 0.25], ["run-glow", 0.55]]) map.setPaintProperty(id, "line-opacity", opacity * progress);
      if (progress >= 1) map.getSource("ends").setData({ type: "FeatureCollection", features: [
        { type: "Feature", geometry: { type: "Point", coordinates: route[0] } },
        { type: "Feature", geometry: { type: "Point", coordinates: route[route.length - 1] } },
      ] });
    };
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return reveal(1);
    const duration = 3200, start = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const frame = (now) => {
      const t = Math.min((now - start) / duration, 1);
      reveal(t >= 1 ? 1 : ease(t));
      if (t < 1) requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
</script>
</body>
</html>
